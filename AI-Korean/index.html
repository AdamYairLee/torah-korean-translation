    <meta name="description" content="AI Korean Master is a Korean reading-first learning project for Hebrew and English speakers. Learn Hangul, daily expressions, real conversation reading, and business Korean." />

  <meta name="application-name" content="AI Korean Master" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="KoreanMaster" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta property="og:title" content="AI Korean Master" />

  <meta property="og:type" content="website" />

<link rel="stylesheet" href="css/style.css" />
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-TNJDSEN912"></script>

<body>
  <a href="https://jewishkorean.com" class="home-btn">דף הבית <span>(홈으로 돌아가기)</span></a>

  <main id="app" class="fade-in">
    <h1 class="main-title">Don't study,<br />Just read first!</h1>
    <section class="today-card">
      <div class="today-label">🇰🇷 Today's Korean <span class="korean-sub">(오늘의 표현)</span></div>
      <div class="today-ko">안녕하세요</div>
      <div class="today-he" dir="rtl">שלום</div>
    </section>
    <div class="btn-group main-menu">
      <button type="button" onclick="showCurriculumMenu()">
        קורס מאסטר לאותיות ותנועות ותנועות
        <span class="korean-sub">(자·모음 마스터 코스)</span>
      </button>
      <button type="button" onclick="loadPhraseMode('pronunciation')">
        קריאת שיחות אמיתיות
        <span class="korean-sub">(실전 회화 읽기)</span>
      </button>
      <button type="button" onclick="loadWordMode('daily')">
        בטויים שמושיים ליוםיום
        <span class="korean-sub">(일상 필수 표현)</span>
      </button>
      <button type="button" onclick="loadWordMode('business')">
        ביטויים חיוניים לעסקים
        <span class="korean-sub">(비즈니스 필수 표현)</span>
      </button>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
