<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI Korean Master</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a href="https://jewishkorean.com" class="home-btn">
        דַף הַבַּיִת (홈으로 돌아가기)
    </a>

    <div id="app" class="fade-in">
        <h1 class="main-title">Don't study,<br>Just read first!</h1>

        <div class="btn-group">
            <button onclick="showCurriculumMenu()">
                קַורְס מַאסְטֶר לִאָלְפָבֵּית
                <span class="korean-sub">(자·모음 마스터 코스)</span>
            </button>
            <button onclick="loadLearning('pronunciation')">
                מַצַב אִמּוּן הֲגִיָה
                <span class="korean-sub">(발음 훈련 모드)</span>
            </button>
            <button onclick="loadLearning('daily')">
                אֹוסֵף מִילִים יוֹמִי
                <span class="korean-sub">(일상 필수 단어 훈련)</span>
            </button>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
