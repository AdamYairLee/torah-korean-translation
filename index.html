    <title>유대교 문헌 한글 번역</title>
    <meta name="description" content="토라를 기반으로 하는 모든 유대교 문헌을 한국어로 번역하는 공간입니다.">

<body>

    <header class="header-top">
        <div class="header-left">
            <button id="dark-mode-toggle">다크 모드 전환</button>
        </div>
        <div class="header-right">
            <div class="basd-text">בס"ד</div>
            <div id="shabbat-info"></div>

    <a href="index.html" style="text-decoration: none; color: inherit;">

    <div class="menu-wrapper">
        <div class="main-nav">
            <div class="menu-item">
                <button onclick="toggleMenu('torah-menu')">기록 토라</button>
                <div id="torah-menu" class="sub-menu">
                    <button onclick="loadContent('data/bereshit.json')">베레쉬트 '창세기'</button>
                    <button onclick="loadContent('data/shemot.json')">슈모트 '출애굽기/탈출기'</button>
                    <button onclick="loadContent('data/vayikra.json')">바이크라 '레위기'</button>
                    <button onclick="loadContent('data/bamidbar.json')">바미드바르 '민수기'</button>
                    <button onclick="loadContent('data/devarim.json')">드바림 '신명기'</button>
                </div>
            </div>
            
            <div class="menu-item">
                <button onclick="loadContent('data/midrash.json')">구전 토라</button>
            </div>

            <div class="menu-item">
                <button onclick="toggleMenu('lecture-menu')">토라 강의</button>
                <div id="lecture-menu" class="sub-menu">
                    <button onclick="toggleMenu('steinsaltz-menu')">슈타인잘쯔 강의</button>
                    <div id="steinsaltz-menu" class="sub-menu">
                        <button onclick="loadContent('data/steinsaltz_bereshit.json')">베레쉬트 '창세기'</button>
                        <button onclick="loadContent('data/steinsaltz_shemot.json')">슈모트 '출애굽기/탈출기'</button>
                        <button onclick="loadContent('data/steinsaltz_vayikra.json')">바이크라 '레위기'</button>
                        <button onclick="loadContent('data/steinsaltz_bamidbar.json')">바미드바르 '민수기'</button>
                        <button onclick="loadContent('data/steinsaltz_devarim.json')">드바림 '신명기'</button>
                    </div>
                </div>
            </div>

            <div class="menu-item"><button onclick="toggleMenu('etc-menu')">유대교 이모저모</button><div id="etc-menu" class="sub-menu"></div></div>
            <div class="menu-item"><button onclick="loadBlog('data/noahide.json')">노아하이드 강의</button></div>
            
            <div class="menu-item">
                <button onclick="toggleMenu('travel-menu')">이스라엘 여행 정보</button>
                <div id="travel-menu" class="sub-menu">
                    <button onclick="loadContent('data/tomb.json')">거룩한 무덤</button>
                    <button onclick="loadContent('data/spots.json')">추천 여행지</button>
                    <button onclick="loadContent('data/restaurants.json')">추천 식당</button>
                </div>
            </div>

            <div class="search-container">
                <input type="text" id="search-input" placeholder="검색어 입력..." onkeydown="if(event.keyCode==13) performSearch()">
            </div>
        </div>
    </div>

    <div id="welcome-message" class="fade-in-text">
        한국어로 만나는 가장 방대한 유대교 문헌 아카이브 프로젝트
    </div>

    <div class="search-guide">
        원하는 장이나 제목, 문구를 ctrl + f 버튼으로 찾아보세요.<br>
        토라의 히브리어 본문을 누르면 라쉬 해설을 볼 수 있습니다.
    </div>

    <main id="torah-container">
        본문을 선택해주세요.
    </main>

    <footer class="footer-support">
        <div class="bottom-links">
            <button class="tiny-btn" onclick="showInfo('about')">소개</button>
            <button class="tiny-btn" onclick="showInfo('contact')">문의</button>
            <button class="tiny-btn" onclick="showInfo('privacy')">개인정보</button>
